baseURL = "https://magazine.interconstruction.fr/"
title = "Le Mag Interconstruction"
theme = "mag-interconstruction"
timeZone = "Europe/Paris"

defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false

[languages]
  [languages.fr]
    languageCode = "fr-FR"
    languageName = "Français"
    contentDir = "content/fr"
    weight = 1
    title = "Le Mag Interconstruction"
    [languages.fr.params]
      description = "Le magazine de l'immobilier neuf en Île-de-France : conseils, guides et actualités pour acheter, investir et habiter dans le neuf."

  [languages.en]
    languageCode = "en-US"
    languageName = "English"
    contentDir = "content/en"
    weight = 2
    title = "Le Mag Interconstruction"
    [languages.en.params]
      description = "The new-build real estate magazine for the Île-de-France region: tips, guides and news to buy, invest and live in new homes."

[taxonomies]
  category = "categories"

