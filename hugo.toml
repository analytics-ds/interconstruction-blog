[params]
  default_og_image = "/images/og-default.jpg"
  logo = "/favicon.png"
  founding_year = "2026"
  expertise = ["Immobilier neuf", "Investissement immobilier", "Île-de-France"]
  og_locale_alternate = "en_US"

[related]
  includeNewer = true
  threshold = 80
  [[related.indices]]
    name = "categories"
    weight = 100

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = true
  [markup.goldmark.renderer]
    unsafe = true
